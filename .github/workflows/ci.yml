name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Model and security regression tests
        run: swift test -c release --arch arm64 --jobs 2 -Xswiftc -Osize
      - name: Package development app
        run: python3 scripts/package-app.py --arch arm64
      - name: Verify package metadata
        run: python3 scripts/verify-package.py build/release/arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Locus-development-arm64
          path: |
            build/release/arm64/Locus-arm64.zip
            build/release/arm64/Locus-arm64.dmg
            build/release/arm64/SHA256SUMS-arm64.txt
          retention-days: 14
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
